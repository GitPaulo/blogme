name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The deploy workflows run this before publishing, so nothing ships untested.
  workflow_call:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # From go.mod, so tests run on the version the deploy builds with.
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - run: gofmt -l . | (! grep .)
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          # Must be built with a Go >= the go directive in api/go.mod.
          version: v2.13.1
          working-directory: api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm run build
