name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The deploy workflows run this before publishing, so nothing ships untested.
  workflow_call:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # From go.mod, so tests run on the version the deploy builds with.
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - run: gofmt -l . | (! grep .)
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          # Must be built with a Go >= the go directive in api/go.mod.
          version: v2.13.1
          working-directory: api

  # blogs.yml and blogs-overrides.yml have to agree, and until now nothing said so
  # without a two-hour rebuild — so six corrections sat committed and undelivered for a
  # day. The check reads two files off disk: seconds, no network, no credentials.
  sources:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sources/tools

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sources/tools/requirements.txt

      - run: pip install -r requirements.txt
      - run: python -m unittest discover -p 'test_*.py'
      - run: python patch_sources.py --check

  # The infra scripts provision, deploy and refresh the front page, and until now nothing
  # read them but a shell at the moment they ran. Shellcheck is on the runner image
  # already, so this is a checkout and a second.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck infra/*.sh infra/ci/*.sh

  # A workflow file is only checked when it runs, and an invalid one does not fail
  # loudly: it produces a run with no jobs, no logs and the file path where its name
  # should be. `refresh-popular.yml` shipped with `runner.temp` in a job-level `env`,
  # which is not one of the contexts allowed there, and failed silently on every push
  # until someone read the Actions tab. Actionlint catches exactly that, in a second.
  #
  # Pinned and taken from the release rather than an action, for the reason deploy-api
  # takes Core Tools the same way: a release asset is immutable and cannot be withdrawn
  # from under a build.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint the workflow files
        env:
          ACTIONLINT_VERSION: '1.7.12'
        run: |
          set -euo pipefail
          base=https://github.com/rhysd/actionlint/releases/download
          curl -fsSL "$base/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" actionlint
          # Its own shellcheck pass would re-flag the `run:` blocks the shell job owns.
          "$RUNNER_TEMP/actionlint" -color -shellcheck=

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
