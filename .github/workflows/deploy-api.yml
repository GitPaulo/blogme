name: Deploy API to Azure Functions

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'infra/search-index.json'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

# Let a running deployment finish rather than cancelling it mid-publish.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  # Shipping a failing build is the one failure that costs something, so the
  # tests gate the deploy rather than merely running alongside it.
  ci:
    uses: ./.github/workflows/ci.yml

  # The index schema must be current before the code that queries it ships:
  # selecting a field the index does not have 400s every search. Applied on
  # every deploy rather than only when the file changes, because the PUT is an
  # upsert, so "always current" is correct without any diffing to get wrong.
  index:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Azure rejects edits that would need a rebuild, so an incompatible schema
      # fails here and blocks the deploy instead of breaking search.
      - name: Apply the search index schema
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          SEARCH_SERVICE="$(az search service list -g "$RESOURCE_GROUP" --query '[0].name' -o tsv)"
          export SEARCH_SERVICE
          ./infra/create-search-index.sh

  deploy:
    needs: [ci, index]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for the OIDC token exchange with Entra ID.
      id-token: write
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Core Tools compiles the Go worker and publishes it, reusing the Azure CLI login.
      # Pinned rather than floating on @4: 4.14.0 ships an npm-shrinkwrap.json
      # that resolves chalk from a private Azure DevOps feed, so installing it
      # 401s for everyone outside Microsoft. 4.13.2 is the last good release.
      # Unpin once upstream republishes.
      - name: Install Azure Functions Core Tools
        run: npm install -g azure-functions-core-tools@4.13.2

      - name: Publish
        env:
          # Core Tools infers this from local.settings.json, which is not committed.
          FUNCTIONS_WORKER_RUNTIME: native
        run: func azure functionapp publish ${{ vars.AZURE_FUNCTIONAPP_NAME }}

      # Retries cover the cold start; a failure here means the published app is
      # already live and broken, so this reports rather than prevents.
      - name: Verify the deployed app responds
        run: |
          curl --fail --show-error --silent --retry 5 --retry-all-errors --retry-delay 10 \
            "https://${{ vars.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api/health"
