# Subject tags for sources/blogs.yml.
#
# Each tag lists the words and phrases that imply it. Matching is whole-word and
# case-insensitive, against a blog's own title, description and recent post titles.
#
# A tag is kept when it scores at least 2 points:
#   2 points  the blog files its posts under that word (a feed category)
#   1 point   each distinct keyword found in the blog's text
#
# So one passing mention is never enough, but a self-declared category always is.
# Order matters: when a blog matches more tags than fit, the earlier ones win.
#
# To add a tag, add an entry here. Nothing else needs changing.

