# Draft workflow. Copy into .github/workflows/ to enable it.
# Never run, so the versions below are current but unverified.
name: Build blog sources

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

jobs:
  build-sources:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sources/tools

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sources/tools/requirements.txt

      - run: pip install -r requirements.txt

      - name: Build sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build_sources.py

      # Uploaded rather than committed so the list still goes through review.
      - uses: actions/upload-artifact@v7
        with:
          name: blog-sources
          # Paths in `with` are workspace-relative, not working-directory-relative.
          path: |
            sources/blogs.yml
            sources/tools/link-audit.csv
