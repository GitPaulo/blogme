# Draft workflow. Copy into .github/workflows/ to enable it.
name: Build blog sources

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

jobs:
  build-sources:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sources/tools

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build_sources.py

      # Uploaded rather than committed so the list still goes through review.
      - name: Upload generated sources
        uses: actions/upload-artifact@v4
        with:
          name: blog-sources
          path: |
            sources/blogs.yml
            sources/tools/link-audit.csv
